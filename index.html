<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Proof Alarm</title>
<style>
:root{box-sizing:border-box;color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#ffffff;--card:#ffffff;--ink:#111113;--mute:#8a8a90;--line:#ebebef;--btn:#111113;--btnink:#ffffff;--soft:#f4f4f6}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:#fff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Inter","Helvetica Neue",Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center}
.card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:28px;padding:36px 24px;box-shadow:0 10px 40px rgba(0,0,0,.05)}
section{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;width:100%}
.label{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-bottom:10px;text-align:center;padding-left:.14em}
.clock{font-size:64px;font-weight:200;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:4px 0 26px;text-align:center;width:100%}
.timewrap{width:100%;display:flex;justify-content:center;margin-bottom:16px}
input[type=time]{-webkit-appearance:none;appearance:none;font:inherit;font-size:40px;font-weight:300;width:100%;max-width:100%;background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:14px 8px;font-variant-numeric:tabular-nums;text-align:center;display:flex;align-items:center;justify-content:center;min-height:76px}
input[type=time]::-webkit-datetime-edit{padding:0;text-align:center;flex:0 0 auto}
input[type=time]::-webkit-datetime-edit-fields-wrapper{display:flex;justify-content:center}
input[type=time]::-webkit-calendar-picker-indicator{display:none}
button{font:inherit;font-size:17px;font-weight:600;width:100%;border:0;border-radius:18px;padding:18px;background:var(--btn);color:var(--btnink);cursor:pointer;display:block;text-align:center}
button.ghost{background:transparent;color:var(--mute);font-size:14px;font-weight:500;padding:12px;margin-top:6px}
button:disabled{opacity:.4}
.hint{font-size:13px;color:var(--mute);line-height:1.5;margin:16px auto 0;text-align:center;max-width:300px}
.item{font-size:32px;font-weight:600;letter-spacing:-.01em;margin:6px 0 22px;padding:22px 12px;background:var(--soft);border:1px solid var(--line);border-radius:20px;width:100%;text-align:center}
.pulse{width:14px;height:14px;border-radius:50%;background:var(--ink);margin:0 auto 18px;animation:p 1.2s ease-in-out infinite}
@keyframes p{0%,100%{transform:scale(.7);opacity:.3}50%{transform:scale(1.5);opacity:1}}
.msg{min-height:20px;font-size:14px;margin-top:14px;color:var(--mute);text-align:center;width:100%}
.msg.bad{color:var(--ink);font-weight:600}
.thumb{width:100%;max-height:200px;object-fit:cover;border-radius:16px;margin-bottom:14px}
.hidden{display:none!important}
</style>
</head>
<body>
<main class="card">

  <section id="setView">
    <div class="label">Now</div>
    <div class="clock" id="nowClock">--:--</div>
    <div class="label">Wake me at</div>
    <div class="timewrap"><input type="time" id="timeIn" value="07:00"></div>
    <button id="setBtn">Set alarm</button>
    <button class="ghost" id="testBtn">Test in 10 seconds</button>
    <div style="width:100%;margin-top:18px;padding-top:18px;border-top:1px solid var(--line)">
      <div class="label">Anthropic API key</div>
      <input type="password" id="keyIn" placeholder="sk-ant-..." autocomplete="off" style="font:inherit;font-size:15px;width:100%;text-align:center;background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px">
      <button class="ghost" id="keyBtn" style="border:1px solid var(--line);color:var(--ink);margin-top:0">Save key</button>
      <div class="hint" id="keyStatus" style="margin-top:10px"></div>
    </div>
    <p class="hint">Keep this page open. Once set, the alarm can only be stopped by photographing the item you're given.</p>
  </section>

  <section id="waitView" class="hidden">
    <div class="label">Alarm set for</div>
    <div class="clock" id="alarmClock">--:--</div>
    <div class="hint" id="countdown"></div>
    <button class="ghost" id="changeBtn" style="margin-top:18px;border:1px solid var(--line);color:var(--ink);font-size:16px">Change time</button>
    <p class="hint">Leave this page open and your device awake and unmuted.</p>
  </section>

  <section id="ringView" class="hidden">
    <div class="pulse"></div>
    <div class="label">Time to wake up</div>
    <div class="clock" id="ringClock">--:--</div>
    <button id="wakeBtn">I'm awake</button>
  </section>

  <section id="challengeView" class="hidden">
    <div class="pulse"></div>
    <div class="label">Take a photo of</div>
    <div class="item" id="itemName">—</div>
    <img id="thumb" class="thumb hidden" alt="">
    <input type="file" id="cam" accept="image/*" capture="environment" class="hidden">
    <button id="photoBtn">Take photo</button>
    <div class="msg" id="msg"></div>
  </section>

  <section id="doneView" class="hidden">
    <div class="label">Alarm off</div>
    <div class="clock">Good morning</div>
    <button id="againBtn">Set a new alarm</button>
  </section>

</main>

<script>
const ITEMS=["a spoon","a toothbrush","a pillow","a TV remote","a coffee mug","a fork","a towel","a pair of scissors","a house key","a shoe","a book","a pen","a drinking glass","a plate","a hairbrush","a roll of toilet paper","a phone charger","a toothpaste tube","a water bottle","a spatula"];
const KEY="proof-alarm-v3";
const $=id=>document.getElementById(id);
const views=["setView","waitView","ringView","challengeView","doneView"];
let st=load();            // {at:ms, item:string|null, stage:'wait'|'ring'|'challenge'}
let actx=null, ringTimer=null, master=null, wakeLock=null, checking=false;

function load(){try{return JSON.parse(localStorage.getItem(KEY))||null}catch(e){return null}}
function save(){try{st?localStorage.setItem(KEY,JSON.stringify(st)):localStorage.removeItem(KEY)}catch(e){}}
function show(v){views.forEach(x=>$(x).classList.toggle("hidden",x!==v))}
const fmt=d=>d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});

/* ---------- sound: calm, warm, loud ---------- */
function ensureAudio(){
  try{
    if(!actx){actx=new (window.AudioContext||window.webkitAudioContext)();
      master=actx.createGain();master.gain.value=1;
      const comp=actx.createDynamicsCompressor();master.connect(comp);comp.connect(actx.destination);}
    if(actx.state!=="running")actx.resume();
  }catch(e){}
}
function chime(freq,t,dur){
  [[1,.55],[2,.18],[3,.07]].forEach(([m,g])=>{
    const o=actx.createOscillator(),e=actx.createGain();
    o.type="sine";o.frequency.value=freq*m;
    e.gain.setValueAtTime(0,t);e.gain.linearRampToValueAtTime(g,t+.04);
    e.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(e);e.connect(master);o.start(t);o.stop(t+dur+.05);
  });
}
function phrase(){
  if(!actx||actx.state!=="running")return;
  const t=actx.currentTime+.05;
  [523.25,659.25,783.99,1046.5,783.99,659.25].forEach((f,i)=>chime(f,t+i*.38,2.4));
}
function startRing(){
  ensureAudio();
  if(ringTimer)return;
  phrase();ringTimer=setInterval(()=>{ensureAudio();phrase()},3200);
  try{navigator.wakeLock&&navigator.wakeLock.request("screen").then(l=>wakeLock=l).catch(()=>{})}catch(e){}
  if(navigator.vibrate)try{navigator.vibrate([400,300,400])}catch(e){}
}
function stopRing(){clearInterval(ringTimer);ringTimer=null;try{wakeLock&&wakeLock.release()}catch(e){}}
// any touch keeps audio unlocked while ringing
["pointerdown","keydown","touchstart"].forEach(ev=>addEventListener(ev,()=>{if(st&&st.stage!=="wait")ensureAudio()},{passive:true}));

/* ---------- flow ---------- */
function arm(at){
  st={at,item:null,stage:"wait"};save();ensureAudio();render();
}
const KK="proof-alarm-apikey";
const getKey=()=>{try{return localStorage.getItem(KK)||""}catch(e){return ""}};
function keyUI(){$("keyStatus").textContent=getKey()?"Key saved on this device ✓":"Required: paste your key so photos can be checked."}
$("keyBtn").onclick=()=>{const v=$("keyIn").value.trim();if(!v)return;try{localStorage.setItem(KK,v)}catch(e){}$("keyIn").value="";keyUI()};
keyUI();
$("setBtn").onclick=()=>{
  if(!getKey()){$("keyStatus").textContent="Save your API key first, or the alarm couldn't be stopped.";return}
  const [h,m]=($("timeIn").value||"07:00").split(":").map(Number);
  const d=new Date();d.setHours(h,m,0,0);
  if(d.getTime()<=Date.now())d.setDate(d.getDate()+1);
  arm(d.getTime());
};
$("testBtn").onclick=()=>{if(!getKey()){$("keyStatus").textContent="Save your API key first.";return}arm(Date.now()+10000)};
$("changeBtn").onclick=()=>{
  if(!st||st.stage!=="wait")return;
  const d=new Date(st.at),pad=n=>String(n).padStart(2,"0");
  $("timeIn").value=pad(d.getHours())+":"+pad(d.getMinutes());
  st=null;save();render();
};
$("timeIn").addEventListener("keydown",e=>{if(e.key==="Enter")$("setBtn").click()});
$("againBtn").onclick=()=>{st=null;save();render()};

$("wakeBtn").onclick=()=>{
  ensureAudio();
  if(!st.item)st.item=ITEMS[Math.floor(Math.random()*ITEMS.length)];
  st.stage="challenge";save();render();
};
$("photoBtn").onclick=()=>{if(!checking){$("cam").value="";$("cam").click()}};
$("cam").onchange=async e=>{
  const f=e.target.files&&e.target.files[0];if(!f)return;
  await verify(f);
};

function msg(t,bad){const m=$("msg");m.textContent=t;m.className="msg"+(bad?" bad":"")}

function shrink(file){
  return new Promise((res,rej)=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{
      const s=Math.min(1,1024/Math.max(img.width,img.height));
      const c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b=>b?res(b):rej(new Error("blob")),"image/jpeg",.85);
    };
    img.onerror=()=>rej(new Error("img"));img.src=url;
  });
}

async function verify(file){
  checking=true;$("photoBtn").disabled=true;msg("Checking photo…");
  try{
    const blob=await shrink(file);
    const th=$("thumb");th.src=URL.createObjectURL(blob);th.classList.remove("hidden");
    const key=getKey();
    if(!key){msg("No API key saved. Alarm keeps ringing.",true);return}
    const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(",")[1]);r.onerror=rej;r.readAsDataURL(blob)});
    const resp=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",
      headers:{"Content-Type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model:"claude-sonnet-5-5",max_tokens:200,messages:[{role:"user",content:[
        {type:"image",source:{type:"base64",media_type:"image/jpeg",data:b64}},
        {type:"text",text:`You are the judge for a wake-up alarm. The person must photograph this household item: "${st.item}".
Is the main subject of the photo that item (a real object, not a screen or printed picture)?
Reply with ONLY one line of JSON, no backticks: {"match": true or false, "seen": "3-6 words describing the main object"}`}]}]})
    });
    if(!resp.ok){const t=await resp.text();const e=new Error(t);e.code="http_"+resp.status;throw e}
    const data=await resp.json();
    const r={text:(data.content||[]).map(c=>c.text||"").join("")};
    let out=null;
    try{out=JSON.parse((r.text.match(/\{[\s\S]*\}/)||[""])[0])}catch(e){}
    if(!out){msg("Got an unreadable answer from the checker. Try the photo again.",true);return}
    if(out.match===true){
      stopRing();st=null;save();render();
    }else{
      msg("That looks like "+(out.seen||"something else")+". Find "+st.item+".",true);
    }
  }catch(err){
    const c=err&&err.code?err.code:"error";
    msg(c==="http_401"?"API key was rejected. Check the key.":c==="http_402"||c==="http_429"?"Out of API credit or rate limited ("+c+").":"Check failed ("+c+"), not a wrong item. Try again.",true);
  }finally{checking=false;$("photoBtn").disabled=false}
}

/* ---------- render / tick ---------- */
function render(){
  if(!st){stopRing();show("setView");return}
  if(st.stage==="wait"){stopRing();show("waitView");$("alarmClock").textContent=fmt(new Date(st.at));return}
  startRing();
  if(st.stage==="ring"){show("ringView");return}
  $("itemName").textContent=st.item;show("challengeView");
}
function tick(){
  $("nowClock").textContent=fmt(new Date());
  if(!st)return;
  if(st.stage==="wait"){
    const ms=st.at-Date.now();
    if(ms<=0){st.stage="ring";save();$("ringClock").textContent=fmt(new Date());render()}
    else{
      const s=Math.ceil(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60);
      $("countdown").textContent=(h?h+"h ":"")+m+"m "+(s%60)+"s remaining";
    }
  }else{$("ringClock").textContent=fmt(new Date())}
}
// refuse to be closed casually while armed
addEventListener("beforeunload",e=>{if(st){e.preventDefault();e.returnValue=""}});
// if the tab is hidden then returns while ringing, make sure sound resumes
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&st&&st.stage!=="wait"){ensureAudio()}});
setInterval(tick,500);tick();render();
</script>
</body>
</html>
